workflows:
  nova_android_debug:
    name: NOVA Planner Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Build web app
        script: npm run build
      - name: Create Android project
        script: npx cap add android
      - name: Sync native plugins
        script: npx cap sync android
      - name: Generate original NOVA icon and splash assets
        script: npm run assets:android
      - name: Build installable debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/reports/**
